name: Build Healthy Me APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Healthy Me v0.1 source
        shell: bash
        env:
          HEALTHY_ME_SOURCE_B64: 
        run: |
          mkdir -p "$RUNNER_TEMP/healthyme"
          printf '%s' "$HEALTHY_ME_SOURCE_B64" | base64 --decode > "$RUNNER_TEMP/healthyme/source.zip"
          unzip -q "$RUNNER_TEMP/healthyme/source.zip" -d "$RUNNER_TEMP/healthyme"
          cp -R "$RUNNER_TEMP/healthyme/healthy_me_beta_v0_1_source/." "$GITHUB_WORKSPACE/"

      - name: Generate Android shell
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/healthy_me_android"
          flutter create --platforms=android --org com.rustnrum --project-name healthy_me "$RUNNER_TEMP/healthy_me_android"
          rm -rf android
          cp -R "$RUNNER_TEMP/healthy_me_android/android" ./android
          cp tooling/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/rustnrum/healthy_me
          cp tooling/android/MainActivity.kt android/app/src/main/kotlin/com/rustnrum/healthy_me/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthy-me-v0.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

name: Build Healthy Me v0.5 FINAL SIGNED APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Healthy Me v0.5 source
        shell: bash
        env:
          HM_B64_01: 
          HM_B64_02: 
          HM_B64_03: 
          HM_B64_04: 
          HM_B64_05: 
          HM_B64_06: 
          HM_B64_07: 
          HM_B64_08: 
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/healthyme"
          printf '%s' \
            "$HM_B64_01" \
            "$HM_B64_02" \
            "$HM_B64_03" \
            "$HM_B64_04" \
            "$HM_B64_05" \
            "$HM_B64_06" \
            "$HM_B64_07" \
            "$HM_B64_08" | base64 --decode > "$RUNNER_TEMP/healthyme/source.zip"
          unset HM_B64_01 HM_B64_02 HM_B64_03 HM_B64_04 HM_B64_05 HM_B64_06 HM_B64_07 HM_B64_08
          unzip -q "$RUNNER_TEMP/healthyme/source.zip" -d "$RUNNER_TEMP/healthyme"
          cp -R "$RUNNER_TEMP/healthyme/healthy_me_beta_v0_5_source/." "$GITHUB_WORKSPACE/"

      - name: Generate Android shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/healthy_me_android"
          flutter create --platforms=android --org com.rustnrum --project-name healthy_me "$RUNNER_TEMP/healthy_me_android"
          rm -rf android
          cp -R "$RUNNER_TEMP/healthy_me_android/android" ./android
          cp tooling/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/rustnrum/healthy_me
          cp tooling/android/MainActivity.kt android/app/src/main/kotlin/com/rustnrum/healthy_me/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true

      - name: Install and verify permanent beta signing key
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="26B9245BF56C3420F4826874CD8A0BF93D451FD94B531171B10498A825AF7F23"
          mkdir -p "$HOME/.android"
          cp tooling/android/healthyme-beta-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Expected beta cert: $EXPECTED"
          echo "Keystore cert:      $KEY_SHA"
          test "$KEY_SHA" = "$EXPECTED"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Re-sign APK with permanent beta key
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BUILD_TOOLS_DIR="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          INPUT_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="$RUNNER_TEMP/healthy-me-v0.5-aligned.apk"
          FINAL_DIR="dist"
          FINAL_APK="$FINAL_DIR/healthy-me-v0.5.apk"
          test -f "$INPUT_APK"
          mkdir -p "$FINAL_DIR"

          "$ZIPALIGN" -f 4 "$INPUT_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          test -s "$FINAL_APK"
          "$ZIPALIGN" -c -v 4 "$FINAL_APK"

      - name: Verify final APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="26B9245BF56C3420F4826874CD8A0BF93D451FD94B531171B10498A825AF7F23"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          FINAL_APK="dist/healthy-me-v0.5.apk"
          test -x "$APKSIGNER"
          test -s "$FINAL_APK"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" | tee "$RUNNER_TEMP/apksigner-final.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-final.txt" | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Expected APK cert: $EXPECTED"
          echo "Final APK cert:    $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          AAPT="$BUILD_TOOLS_DIR/aapt"
          if [ -x "$AAPT" ]; then
            echo "APK package/version:"
            "$AAPT" dump badging "$FINAL_APK" | head -n1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthy-me-v0.5-apk
          path: dist/healthy-me-v0.5.apk
          if-no-files-found: error

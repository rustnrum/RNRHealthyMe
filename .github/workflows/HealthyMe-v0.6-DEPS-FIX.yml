name: Build Healthy Me v0.6 DEPS FIX APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/HealthyMe-build-v06-deps-fixed.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Healthy Me v0.6 source
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf app "$RUNNER_TEMP/healthyme-v06"
          mkdir -p app "$RUNNER_TEMP/healthyme-v06"

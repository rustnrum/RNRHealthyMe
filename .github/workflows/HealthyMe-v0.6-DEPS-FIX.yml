          test -f "$RUNNER_TEMP/healthyme-v06/healthy_me_beta_v0_6_source/pubspec.yaml"
          cp -R "$RUNNER_TEMP/healthyme-v06/healthy_me_beta_v0_6_source/." app/
          test -f app/lib/main.dart
          test -f app/lib/services/health_service.dart
          test -f app/lib/services/lab_import_service.dart
          test -f app/tooling/android/healthyme-beta-debug.keystore
          grep -q '^version: 0.6.0+6$' app/pubspec.yaml
          grep -q '^  file_picker: 11.0.3$' app/pubspec.yaml
          grep -q '^  health: \^13.3.2$' app/pubspec.yaml

      - name: Generate Android shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/healthy_me_android"
          flutter create --platforms=android --org com.rustnrum --project-name healthy_me "$RUNNER_TEMP/healthy_me_android"
          rm -rf android
          cp -R "$RUNNER_TEMP/healthy_me_android/android" ./android
          cp tooling/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/rustnrum/healthy_me
          cp tooling/android/MainActivity.kt android/app/src/main/kotlin/com/rustnrum/healthy_me/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true

      - name: Install and verify permanent beta signing key
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="26B9245BF56C3420F4826874CD8A0BF93D451FD94B531171B10498A825AF7F23"
          mkdir -p "$HOME/.android"
          cp tooling/android/healthyme-beta-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          KEY_SHA="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Expected beta cert: $EXPECTED"
          echo "Keystore cert:      $KEY_SHA"
          test "$KEY_SHA" = "$EXPECTED"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign final APK with permanent beta key
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BUILD_TOOLS_DIR="$SDK/build-tools/35.0.0"
          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null || true
          fi
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          INPUT_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="$RUNNER_TEMP/healthy-me-v0.6-aligned.apk"
          FINAL_DIR="dist"
          FINAL_APK="$FINAL_DIR/healthy-me-v0.6.apk"
          test -s "$INPUT_APK"
          unzip -tqq "$INPUT_APK"
          rm -f "$ALIGNED_APK" "$FINAL_APK"
          mkdir -p "$FINAL_DIR"
          echo "Using stable Android build-tools: $BUILD_TOOLS_DIR"
          "$ZIPALIGN" -f -p 4 "$INPUT_APK" "$ALIGNED_APK"
          test -s "$ALIGNED_APK"
          unzip -tqq "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 26 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          test -s "$FINAL_APK"
          "$ZIPALIGN" -c -v 4 "$FINAL_APK"

      - name: Verify final APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          KNOWN_CERT="26B9245BF56C3420F4826874CD8A0BF93D451FD94B531171B10498A825AF7F23"
          EXPECTED_PACKAGE="com.rustnrum.healthy_me"
          EXPECTED_VERSION_CODE="6"
          EXPECTED_VERSION_NAME="0.6.0"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          BUILD_TOOLS_DIR="$SDK/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          FINAL_APK="dist/healthy-me-v0.6.apk"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -s "$FINAL_APK"
          unzip -tqq "$FINAL_APK"
          "$ZIPALIGN" -c -v 4 "$FINAL_APK" >/dev/null
          EXPECTED_CERT="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            | grep -i -m1 'SHA256:' \
            | sed -E 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$FINAL_APK")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" \
            | grep -i -m1 'certificate SHA-256 digest:' \
            | sed -E 's/.*digest:[[:space:]]*//' \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')"
          echo "Known permanent cert: $KNOWN_CERT"
          echo "Keystore cert:        $EXPECTED_CERT"
          echo "Final APK cert:       $ACTUAL_CERT"
          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$EXPECTED_CERT" = "$KNOWN_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          if [ -x "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging "$FINAL_APK" | head -n1)"
            echo "$BADGING"
            PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
            VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
            echo "Package:     $PACKAGE_NAME"
            echo "VersionCode: $VERSION_CODE"
            echo "VersionName: $VERSION_NAME"
            test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE"
            test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE"
            test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          fi
          sha256sum "$FINAL_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthy-me-v0.6-apk
          path: app/dist/healthy-me-v0.6.apk
          if-no-files-found: error

      - name: Remove obsolete Healthy Me workflows
        if: success()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for old in \
            .github/workflows/HealthyMe-build-v06.yml \
            .github/workflows/HealthyMe-build-v06-stable.yml \
            .github/workflows/HealthyMe-build-v5-final-signing.yml \
            .github/workflows/HealthyMe-build-v5-fixed.yml \
            .github/workflows/HealthyMe-build-v5-signing-fixed.yml \
            .github/workflows/HealthyMe-build-v5.yml \
            .github/workflows/build-healthyme.yml \
            .github/workflows/build-v2.yml \
            .github/workflows/healthyme_v05_workflow.yml
          do
            if [ -f "$old" ]; then git rm -f "$old"; fi
          done
          if git diff --cached --quiet; then
            echo "No obsolete workflows remain."
            exit 0
          fi
          git commit -m "Remove obsolete Healthy Me workflows"
          git push origin HEAD:main
